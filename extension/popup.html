<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Акт 16 — проверка на имот</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; width: 360px; background: #121418; color: #f2f0ea;
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .stripe { height: 6px; background: repeating-linear-gradient(-45deg, #ffc21a 0 10px, #121418 10px 20px); }
      header { display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px; }
      .mark {
        width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; background: #ffc21a; color: #121418;
        font-weight: 900; font-size: 17px; letter-spacing: -0.03em; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.15);
      }
      header b { display: block; color: #fff; font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; }
      header span { display: block; color: #a3aab5; font-size: 11.5px; }
      main { padding: 0 14px 14px; display: grid; gap: 12px; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      .search { display: flex; gap: 6px; padding: 4px; border-radius: 12px; background: #fff; box-shadow: 0 4px 0 #ffc21a; }
      .search input {
        flex: 1; min-width: 0; border: 0; background: transparent; color: #15171b; font: inherit; font-size: 14px; padding: 8px;
      }
      .search input:focus { outline: none; }
      .search:focus-within { box-shadow: 0 4px 0 #ffc21a, 0 0 0 3px rgba(255, 194, 26, 0.55); }
      button, .btn {
        border: 0; border-radius: 9px; background: #ffc21a; color: #121418; font: inherit; font-weight: 800; text-transform: uppercase;
        letter-spacing: 0.03em; padding: 0 12px; min-height: 38px; cursor: pointer;
      }
      button:hover { background: #ffcd3f; }
      :focus-visible { outline: 3px solid #ffc21a; outline-offset: 2px; }
      #status { color: #a3aab5; font-size: 12px; min-height: 1em; }
      #status:empty { display: none; }
      ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
      ol:empty { display: none; }
      .item { display: grid; gap: 4px; padding: 8px 10px; border-radius: 9px; background: #1b1e24; color: inherit; text-decoration: none; border: 1px solid transparent; }
      .item:hover { border-color: #3a404b; }
      .item__top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 8px; }
      .item__id { color: #fff; font: 700 12.5px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: nowrap; }
      .item__place { margin-left: auto; color: #a3aab5; font-size: 11.5px; text-align: right; }
      .item__text { color: #d8d6d0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .badges { display: flex; flex-wrap: wrap; gap: 5px; }
      .badge { padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
      .badge--act16 { background: #0b8770; color: #fff; }
      .badge--permits { background: #e8590c; color: #121418; }
      .badge--none { border: 1px dashed #6b7380; color: #d8d6d0; }
      .hood { padding: 8px 10px; border-radius: 9px; border-left: 4px solid #ffc21a; background: #1b1e24; }
      .hood b { color: #fff; }
      .all { color: #ffc21a; font-weight: 700; font-size: 12px; text-decoration: none; }
      .all:hover { text-decoration: underline; }
      .toggle { display: flex; gap: 8px; align-items: center; color: #d8d6d0; cursor: pointer; }
      .toggle input { width: 16px; height: 16px; accent-color: #ffc21a; }
      nav { display: flex; flex-wrap: wrap; gap: 6px 14px; padding-top: 10px; border-top: 1px solid #2b3038; }
      nav a { color: #f2f0ea; font-weight: 700; text-decoration: none; }
      nav a:hover { color: #ffc21a; }
    </style>
  </head>
  <body>
    <div class="stripe" aria-hidden="true"></div>
    <header>
      <span class="mark" aria-hidden="true">16</span>
      <div><b>Акт 16 Тракер</b><span>Разрешения и Акт 16 в София</span></div>
    </header>
    <main>
      <form id="form" role="search">
        <label for="q" class="sr-only">Адрес, квартал, фирма или идентификатор КККР</label>
        <div class="search">
          <input id="q" name="q" type="search" maxlength="120" autocomplete="off" placeholder="ул. Кутловица или 68134.702.432" />
          <button type="submit">Провери</button>
        </div>
      </form>
      <div id="status" role="status" aria-live="polite"></div>
      <ol id="results" aria-label="Бързи резултати"></ol>
      <label class="toggle"><input type="checkbox" id="enabled" checked /> Показвай панела в обявите за имоти</label>
      <nav aria-label="akt16.org">
        <a href="https://akt16.org/map/" target="_blank" rel="noopener">Карта</a>
        <a href="https://akt16.org/account/" target="_blank" rel="noopener">Профил и следени</a>
        <a href="https://akt16.org/new-buildings/" target="_blank" rel="noopener">Нови сгради</a>
        <a href="https://akt16.org/extension/" target="_blank" rel="noopener">Как работи</a>
      </nav>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
