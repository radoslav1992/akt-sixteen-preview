name: Scrape NAG Certificates

on:
  schedule:
    # Every day at 08:00 UTC (11:00 Bulgarian time)
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      days_back:
        description: "Number of days to scrape back"
        required: false
        default: "90"
      geocode_limit:
        description: "Max Nominatim requests in this run (1 req/s; e.g. 2500 for a backfill)"
        required: false
        default: "400"
      geocode_minutes:
        description: "Max minutes to spend geocoding (keep ≤ 45 so the job finishes within its 60 min timeout)"
        required: false
        default: "8"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run scraper
        run: node scripts/scrape.mjs ${{ github.event.inputs.days_back || '90' }}

      # Incremental geocoding via Nominatim (cached in data/geo/cache.json).
      # Never blocks the data update: failures here are ignored.
      - name: Geocode records
        continue-on-error: true
        run: node scripts/geocode.mjs --limit ${{ github.event.inputs.geocode_limit || '400' }} --max-minutes ${{ github.event.inputs.geocode_minutes || '8' }}

      - name: Check for changes
        id: changes
        run: |
          git add data/ data/geo/
          git diff --cached --quiet -- data/ data/geo/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ data/geo/
          git commit -m "data: update registers $(date -u +%Y-%m-%d)"
          git push
